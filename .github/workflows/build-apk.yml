name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Gradle
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Extract Android project
        run: |
          mkdir -p /tmp/project
          unzip -q FiverrChineseAssistant-*.zip -d /tmp/project

      - name: Build APK
        working-directory: /tmp/project/FiverrChineseAssistant
        run: |
          /tmp/gradle-8.13/bin/gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FiverrChineseAssistant-APK
          path: /tmp/project/FiverrChineseAssistant/app/build/outputs/apk/debug/app-debug.apk
